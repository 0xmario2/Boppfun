<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Fredoka',sans-serif;background:#FFFEF7;color:#111}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;max-width:1200px;margin:0 auto;position:sticky;top:0;background:rgba(255,254,247,0.9);backdrop-filter:blur(12px);z-index:10;border-bottom:2px solid #111}

.bopp-ball-wrap{height:340px;display:flex;justify-content:center;align-items:center;margin:20px 0;position:relative}
#boppBall{width:220px;height:220px;background:#FFEB3B;border:4px solid #111;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:64px;font-weight:700;box-shadow:10px 10px 0 #111;cursor:pointer;animation:boppFloat 2s ease-in-out infinite}
@keyframes boppFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.btn{border:3px solid #111;padding:14px 28px;font-size:18px;font-weight:700;text-decoration:none;color:#111;box-shadow:6px 6px 0 #111;cursor:pointer;display:inline-block}
.btn-primary{background:#FFEB3B}.btn-dark{background:#111;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:50px auto;padding:0 24px}
.stat{border:3px solid #111;padding:18px;background:#fff;box-shadow:6px 6px 0 #111;text-align:center}
.section{max-width:900px;margin:60px auto;padding:0 24px}
.section h2{font-size:36px;border:3px solid #111;display:inline-block;padding:6px 16px;background:#fff;box-shadow:5px 5px 0 #111;margin-bottom:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border:3px solid #111;padding:20px;background:#fff;box-shadow:6px 6px 0 #111}
.how-step{border:3px solid #111;padding:16px;background:#fff;box-shadow:6px 6px 0 #111;position:relative}
.how-step .num{position:absolute;top:-12px;left:12px;background:#FFEB3B;border:2px solid #111;padding:2px 10px;font-weight:700}

</html>
