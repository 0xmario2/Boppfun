<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOPP FUN - JUST BOPP IT</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Fredoka',sans-serif;background:#FFFEF7;color:#111}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;max-width:1200px;margin:0 auto;position:sticky;top:0;background:rgba(255,254,247,0.9);backdrop-filter:blur(12px);z-index:10;border-bottom:2px solid #111}
.logo{font-weight:700;font-size:24px}.logo span{background:#FFEB3B;padding:2px 8px;border:2px solid #111;transform:rotate(-2deg);display:inline-block}
.nav-links{display:flex;gap:12px}
.nav-links a{border:2px solid #111;padding:8px 16px;font-weight:700;text-decoration:none;color:#111;background:#fff;box-shadow:4px 4px 0 #111}
.nav-links a.yellow{background:#FFEB3B}
.hero{max-width:1200px;margin:0 auto;padding:40px 24px 20px;text-align:center}
.hero h1{font-size:clamp(48px,12vw,140px);font-weight:700;line-height:0.85;letter-spacing:-4px}
.hero h1 .bopp{background:#FFEB3B;border:4px solid #111;padding:0 16px;transform:rotate(-3deg);box-shadow:8px 8px 0 #111;display:inline-block}
.bopp-ball-wrap{height:380px;display:flex;justify-content:center;align-items:center;margin:20px 0;position:relative}
#boppBall{
  width:220px;height:220px;
  background:#FFEB3B;
  border:4px solid #111;
  border-radius:50%;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  font-weight:700;
  box-shadow:10px 10px 0 #111;
  cursor:pointer;
  animation:boppFloat 2s ease-in-out infinite;
  position:relative;
}
@keyframes boppFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.bopp-face{font-size:72px;line-height:1}
.bopp-eyes{font-size:48px; margin-bottom:-10px}
.bopp-limbs{position:absolute;width:100%;height:100%;pointer-events:none}
.arm{position:absolute;width:22px;height:45px;background:#FFEB3B;border:3px solid #111;border-radius:10px;top:45%}
.arm.left{left:-12px;transform:rotate(-20deg)}
.arm.right{right:-12px;transform:rotate(20deg)}
.leg{position:absolute;width:24px;height:40px;background:#FFEB3B;border:3px solid #111;border-radius:0 0 10px 10px;bottom:-18px}
.leg.left{left:45px}
.leg.right{right:45px}
.mini-bopp{position:absolute;width:55px;height:55px;background:#FFEB3B;border:3px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;animation:miniFloat 1.5s ease-in-out infinite}
@keyframes miniFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.btn{border:3px solid #111;padding:14px 28px;font-size:18px;font-weight:700;text-decoration:none;color:#111;box-shadow:6px 6px 0 #111;cursor:pointer;display:inline-block}
.btn-primary{background:#FFEB3B}.btn-dark{background:#111;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:50px auto;padding:0 24px}
.stat{border:3px solid #111;padding:18px;background:#fff;box-shadow:6px 6px 0 #111;text-align:center}
</style>
</head>
<body>
<nav>
<div class="logo">bopp<span>FUN</span></div>
<div class="nav-links">
<a href="#" onclick="copyCA()">COPY CA</a>
<a href="https://x.com/boppfun" target="_blank">X @boppfun</a>
<a class="yellow" href="https://pons.fun" target="_blank">BUY $BOPP</a>
</div>
</nav>
<div class="hero">
<h1><span class="bopp">BOPP</span><br>FUN</h1>
<p style="margin:16px auto">a bubble that never pops. just bopp it till you pop it.</p>
<div class="bopp-ball-wrap">
<div style="position:absolute;top:10px;right:20px;background:#fff;border:3px solid #111;padding:8px 14px;font-weight:700;box-shadow:4px 4px 0 #111;z-index:5">TOTAL BOPPS: <span id="count">0</span></div>
<div class="mini-bopp" style="top:20px;left:15%;animation-delay:0.2s">🤩</div>
<div class="mini-bopp" style="top:40px;right:15%;animation-delay:0.5s">🤪</div>
<div class="mini-bopp" style="bottom:60px;left:20%;animation-delay:0.8s">😜</div>
<div class="mini-bopp" style="bottom:40px;right:25%;animation-delay:0.1s">🥳</div>
<div id="boppBall" onclick="bopp()">
  <div class="bopp-limbs">
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  </div>
  <div class="bopp-eyes" id="boppEyes">👀</div>
  <div class="bopp-face" id="boppFace">:D</div>
</div>
</div>
<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">
<a class="btn btn-primary" href="https://pons.fun" target="_blank">BUY ON PONS.FUN</a>
<button class="btn btn-dark" onclick="bopp()">BOPP IT!</button>
<a class="btn" style="background:#fff" href="https://x.com/boppfun" target="_blank">TWITTER @boppfun</a>
</div>
</div>
<div class="stats">
<div class="stat"><div>CHAIN</div><div style="font-weight:700">ROBINHOOD</div></div>
<div class="stat"><div>TAX</div><div style="font-weight:700">0% / 0%</div></div>
<div class="stat"><div>LP</div><div style="font-weight:700">BURNED</div></div>
</div>
<script>
let c=parseInt(localStorage.getItem('boppCount')||'0');
document.getElementById('count').innerText=c;
const faces = [':D','XD','>_<','O_O','🤩','😜','🤪','🥳','😆'];
const eyes = ['👀','🤩','😳','🤪','⭐','👁️👁️'];
function bopp(){
  c++;
  localStorage.setItem('boppCount',c);
  document.getElementById('count').innerText=c;
  const ball = document.getElementById('boppBall');
  ball.style.transform='scale(0.82) rotate(8deg)';
  document.getElementById('boppFace').innerText = faces[Math.floor(Math.random()*faces.length)];
  document.getElementById('boppEyes').innerText = eyes[Math.floor(Math.random()*eyes.length)];
  setTimeout(()=>{ball.style.transform='';},150);
}
function copyCA(){navigator.clipboard.writeText('0xB0PP...FUN (TBA)');alert('CA Copied!')}
</script>
</body>
</html>
